services:
  - type: web
    name: churchhub-api
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: ./services/api-gateway
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: churchhub-db
          property: connectionString
      - key: SECRET_KEY
        value: churchhub-secret-key-2024
      - key: ALGORITHM
        value: HS256
